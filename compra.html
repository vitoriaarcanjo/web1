<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Compra — Soluções Web</title>
</head>
<body>

    <header>
        <h1>Solicitar Compra de Produto ou Serviço</h1>
        <img src="https://picsum.photos/id/425/800/180" alt="Solicitar Compra" width="800" height="180">
    </header>

    <main>
        <section>
            <form>
                <p>Nome completo:<br>
                <input type="text" name="nome" required size="45"></p>
                <p>E-mail:<br>
                <input type="email" name="email" required size="45"></p>
                <p>Telefone / WhatsApp:<br>
                <input type="tel" name="telefone" size="45"></p>
                <p>Produto ou Serviço desejado:<br>
                <select name="produto">
                    <option value="">Selecione uma opção</option>
                    <option value="site">Site Institucional — R$ 1.200,00</option>
                    <option value="loja">Loja Virtual — R$ 3.500,00</option>
                    <option value="manutencao">Manutenção Mensal — R$ 180,00/mês</option>
                    <option value="consultoria">Consultoria Digital — R$ 250,00/hora</option>
                </select></p>
                <p>Quantidade / Horas:<br>
                <input type="number" name="quantidade" min="1" value="1"></p>
                <p>Observações adicionais:<br>
                <textarea name="obs" rows="4" cols="50"></textarea></p>
                <p>Forma de pagamento preferida:<br>
                <input type="radio" name="pagamento" value="pix"> PIX<br>
                <input type="radio" name="pagamento" value="boleto"> Boleto Bancário<br>
                <input type="radio" name="pagamento" value="cartao"> Cartão de Crédito</p>
                <p><input type="submit" value="Enviar Solicitação"></p>
            </form>
        </section>

        <p><a href="catalogo.html">← Voltar para o Catálogo</a></p>
    </main>

    <footer>
        <p><a href="index.html">← Voltar para a Página Inicial</a></p>
    </footer>

</body>
</html>
