<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Tabela</title>
</head>
<body>

    <h2>Exemplo de Tabela</h2>

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Função</th>
                <th>Contato</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Maria Vitória</td>
                <td>Estudante</td>
                <td>maria@email.com</td>
            </tr>
            <tr>
                <td>Wendel Brasil</td>
                <td>Professor</td>
                <td>wendel@email.com</td>
            </tr>
            <tr>
                <td>José Urbano</td>
                <td>Desenvolvedora</td>
                <td>jose@email.com</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">Total de 3 registros cadastrados</td>
            </tr>
        </tfoot>
    </table>

    <p><a href="index.html">← Voltar para a Página Inicial</a></p>
</body>
</html>
