<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dúvidas — Soluções Web</title>
</head>
<body>
    <h1>Pergunte o que quiser!</h1>
    <img src="https://picsum.photos/id/42/800/180" alt="Dúvidas" width="800" height="180">

    <form>
        <p>Qual é o seu nome?<br>
        <input type="text" name="nome" size="45"></p>
        <p>Qual é a sua dúvida?<br>
        <textarea name="duvida" rows="4" cols="50" placeholder="Escreva aqui..."></textarea></p>
        <p>Qual área te interessa mais?<br>
        <input type="checkbox" name="area" value="sites"> Criação de Sites<br>
        <input type="checkbox" name="area" value="lojas"> Lojas Virtuais<br>
        <input type="checkbox" name="area" value="suporte"> Manutenção e Suporte<br>
        <input type="checkbox" name="area" value="outros"> Outros</p>
        <p>Já é nosso cliente?<br>
        <input type="radio" name="cliente" value="sim"> Sim<br>
        <input type="radio" name="cliente" value="nao"> Não ainda</p>
        <p>Qual é o melhor horário para contato?<br>
        <input type="time" name="horario"></p>
        <p><input type="submit" value="Enviar Pergunta"></p>
    </form>

    <p><a href="contate-nos.html">← Voltar para Contato</a><br>
    <a href="index.html">← Voltar para a Página Inicial</a></p>
</body>
</html>
